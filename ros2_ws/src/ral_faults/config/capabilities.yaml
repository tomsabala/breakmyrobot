#
# Which faults are real for which robot, and the gz entity each robot is.
#
# The fault manager reads this (ral_faults/catalogue.py) and refuses any fault
# a robot does not support, publishing a FaultEvent `rejected` carrying the
# `unsupported` reason VERBATIM. A fault offered for a platform it cannot
# affect is the exact failure CLAUDE.md forbids: a control that moves nothing
# but dashboard state.
#
# A robot missing from this file is an ERROR, never an implicit allow - the
# manager refuses rather than guessing that an unknown platform supports
# everything.
#
# `model` is the gz entity name the wrench and the teleport target by name.
# It is here and not in the catalogue because it is a property of the ROBOT:
# `ral_roomba` is the model roomba_sim.launch.py spawns and the one
# bridge_roomba_ral_apartment.yaml's gz topic paths embed.
#
# `car` is described here because the MVP plan defines it here. Phase 4 ships
# no car: there is no ral_car model, no car launch file and no `car` value the
# scenario schema accepts (ral_eval/scenario.py ALLOWED_ROBOTS), so a `car`
# request today fails at the gz layer with the entity-not-found reply gz
# returns - honestly, and without this file claiming otherwise.

roomba:
  model: ral_roomba
  faults: [spawn_obstacle, clear_obstacle, scan_degradation, mobility_fault, kidnap]

car:
  model: ral_car
  faults: [spawn_obstacle, clear_obstacle, mobility_fault, kidnap]
  unsupported:
    scan_degradation: "ArduRover's navigation does not consume the lidar; degrading it has no effect on this platform."
