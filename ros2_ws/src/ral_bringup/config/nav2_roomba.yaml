# Nav2 parameters for ral_roomba in ral_apartment.
#
# Copied in full from
#   /opt/ros/humble/share/nav2_bringup/params/nav2_params.yaml
# (Humble), keeping every node section that bringup_launch.py's lifecycle
# manager expects, with the overrides marked RAL below and nothing else
# changed. The shipped file is tuned for a TurtleBot3; three of its defaults
# are actively wrong for this robot and fail quietly:
#
#   * base_frame_id: "base_footprint" - a link this robot does not have, so
#     AMCL never resolves TF and never publishes a pose.
#   * laser_max_range: 100.0 - the modelled RPLIDAR A1 reports 12.0 m; the
#     extra 88 m are beams the sensor cannot produce.
#   * velocity_smoother max_velocity [0.26, 0.0, 1.0] - this node, not
#     controller_server, publishes /cmd_vel (navigation_launch.py remaps
#     cmd_vel_smoothed -> cmd_vel), so a stale limit here clamps DWB's output
#     and the clamp reads as a controller bug.
#
# PLANT ENVELOPE. Every velocity and acceleration limit below is at or inside
# the DiffDrive limits in ral_description/models/ral_roomba/model.sdf:
#   max_linear_velocity 0.46 m/s, max_angular_velocity 1.9 rad/s,
#   max_linear_acceleration 1.0 m/s^2, max_angular_acceleration 2.5 rad/s^2.
# test/test_nav2_contract.py parses both files and enforces that relationship
# without a simulator, so a limit raised here fails the build rather than
# producing commands the plant silently saturates.
#
# INFLATION. inflation_radius 0.45 with robot_radius 0.18 leaves wall B's
# 0.70 m doorway (half-gap 0.35 m) costed but never lethal at the centreline.
# If the doorway mission fails with the planner refusing or DWB stalling in
# the gap, the fallback ladder is 0.30 then 0.25, in BOTH costmaps, and the
# value in force must match what docs/nav-closed-loop.md reports. Widening the
# doorway in ral_apartment.sdf is not an option: MVP acceptance scenario 4
# (Roomba passes, car does not) depends on that geometry.

amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # RAL: "base_footprint" upstream; this robot's root link is base_link.
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # RAL: 100.0 / -1.0 upstream. The modelled sensor's range is [0.15, 12.0]
    # (model.sdf <range>); matching beyond it weights measurements the lidar
    # cannot make.
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # RAL: 0.0 / 0.0 upstream, which disables random-particle injection
    # entirely. With injection off, a kidnapped robot can never recover and
    # Phase 4.4's kidnap fault would be a foregone loss rather than a test of
    # recovery. These are AMCL's documented defaults for enabling it.
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # RAL: update_min_d was 0.25 upstream. The apartment's rooms are small
    # and a 0.25 m filter update is coarse inside a doorway, so AMCL updates
    # more often. update_min_a is upstream's value, kept.
    update_min_a: 0.2
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # RAL: "scan" upstream (relative). scan_fault_relay's output, absolute, so
    # the topic cannot be re-rooted by a namespace and quietly become empty.
    # Never /scan_raw: that would bypass the boundary Phase 4.2 injects
    # sensor faults at, and the fault would have no effect on localization.
    scan_topic: "/scan"
    # RAL: true upstream. The proof harness and Phase 3's scenario runner
    # publish /initialpose themselves, so a hardcoded initial pose here would
    # silently override the pose a scenario asked for.
    set_initial_pose: false

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # RAL: 10.0 upstream. Threading a 0.70 m doorway at 0.40 m/s involves
      # genuine slow manoeuvring inside the gap; 10 s declares that stuck.
      # A real stall still fails - at 15 s, not never.
      movement_time_allowance: 15.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # RAL: 0.25 / 0.25 upstream. Tightened so "goal reached" means reached:
      # the harness's independent truth check uses 0.25 m, and a goal checker
      # at the same value could report success at the edge of its own
      # tolerance while truth is outside it.
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.25
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # RAL: the six limits below replace TurtleBot3 values with ones inside
      # this robot's DiffDrive envelope (0.46 m/s, 1.9 rad/s, 1.0 m/s^2,
      # 2.5 rad/s^2). Reverse is allowed at a low rate so the BackUp recovery
      # behaviour has a usable command range.
      min_vel_x: -0.10
      min_vel_y: 0.0
      max_vel_x: 0.40
      max_vel_y: 0.0
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.40
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.5
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # RAL: must match general_goal_checker.xy_goal_tolerance above, or DWB
      # and the goal checker disagree about when the robot has arrived.
      xy_goal_tolerance: 0.12
      # RAL: upstream's value, reviewed and KEPT. It is an absolute speed, not
      # a fraction of max_vel_x, and it is the speed below which RotateToGoal
      # stops forcing a decelerating trajectory and allows the final in-place
      # rotation. At this robot's 0.40 m/s it therefore bites EARLIER than it
      # does upstream at 0.26 m/s - stricter, not looser - so raising
      # max_vel_x did not loosen it. Lower it only with a measured goal-error
      # reason; docs/nav-closed-loop.md check 8 is where that would show.
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      # RAL: 3 x 3 upstream. 4 x 4 m keeps a 0.70 m doorway and both of its
      # approach walls inside the window while DWB is rolling trajectories
      # through it.
      width: 4
      height: 4
      resolution: 0.05
      # RAL: 0.22 upstream (TurtleBot3). base_link's collision cylinder is
      # 0.1675 m; 0.18 adds margin for the caster spheres that extend beyond
      # the footprint in z but are within it in xy.
      robot_radius: 0.18
      # RAL: ["voxel_layer", "inflation_layer"] upstream. This robot carries
      # exactly one planar 2D lidar, so a voxel layer costs CPU for a third
      # dimension that contains no measurements.
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # RAL: 0.55 upstream - with robot_radius 0.18 that makes the 0.70 m
        # doorway lethal end to end. See the INFLATION note in the header.
        inflation_radius: 0.45
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # RAL: /scan is scan_fault_relay's output. Never /scan_raw - that
          # would bypass the fault boundary and leave Phase 4.2's sensor
          # degradation with no effect on obstacle avoidance.
          topic: /scan
          # RAL: 2.0 upstream. The lidar sits at z = 0.08 m on a 0.09 m tall
          # chassis; nothing it returns is 2 m up, and the cap documents that.
          max_obstacle_height: 0.6
          clearing: True
          marking: True
          data_type: "LaserScan"
          # RAL: 3.0 / 2.5 upstream. The modelled sensor reaches 12 m; keeping
          # the costmap's ranges below the sensor's but above the 4 m window
          # means the rolling window is cleared from real measurements rather
          # than retaining stale marks at its edge.
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      # RAL: upstream ships this block inside local_costmap while its plugin
      # list omits it, so it is never loaded. Kept to preserve the verbatim
      # copy this file's provenance depends on; the local costmap is rolling
      # and deliberately carries no static map.
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # RAL: 0.22 upstream; see local_costmap.
      robot_radius: 0.18
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # RAL: same relay output as the local costmap; see above.
          topic: /scan
          max_obstacle_height: 0.6
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # RAL: 0.55 upstream; see local_costmap and the INFLATION note.
        inflation_radius: 0.45
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # RAL: 0.5 upstream. A 0.5 m goal tolerance in the planner is most of a
      # 0.70 m doorway; the planner would be free to return a path ending
      # half a doorway short of the requested goal.
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    # RAL: 1.0 / 0.4 / 3.2 upstream. Recovery rotations are commands into the
    # same plant as everything else and must stay inside its envelope
    # (1.9 rad/s, 2.5 rad/s^2).
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # RAL: [0.26, 0.0, 1.0] / [-0.26, 0.0, -1.0] / [2.5, 0.0, 3.2] /
    # [-2.5, 0.0, -3.2] upstream. THIS node publishes /cmd_vel: Nav2's
    # navigation_launch.py remaps controller_server's cmd_vel -> cmd_vel_nav
    # and this node's cmd_vel_smoothed -> cmd_vel, so it is the last stage of
    # the command path and part of the plant chain. Its envelope must equal
    # DWB's, not clamp it: at the shipped 0.26 m/s every DWB command above
    # that is silently truncated, and the truncation looks like a controller
    # that cannot follow its own plan.
    max_velocity: [0.40, 0.0, 1.5]
    min_velocity: [-0.10, 0.0, -1.5]
    max_accel: [1.0, 0.0, 2.5]
    max_decel: [-1.0, 0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
