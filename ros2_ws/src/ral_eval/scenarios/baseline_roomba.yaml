#
# The Phase 2 mission, run through the Phase 3 harness: the same start, the
# same goal in room 3, reachable from room 2 only through wall B's 0.70 m
# doorway. Deliberately identical so this run's numbers are comparable with
# docs/nav-closed-loop.md, which measured the same mission by hand.
#
# initial_pose and goal are in the gz WORLD frame, which is the frame the
# world SDF, the spawn pose and ground truth are all expressed in. The runner
# converts them to `map` with the measured world_to_map alignment before
# publishing /initialpose or sending NavigateToPose, and records BOTH forms in
# run.json so a reader can tell which frame a number is in.
#
# `seed` seeds ral_faults' RNG (Phase 4.2's scan noise and dropout) and
# nothing else. AMCL is not seedable; see docs/repeatability.md.

experiment_id: baseline_roomba
robot: roomba
world: ral_apartment
seed: 1
initial_pose: {x: 0.5, y: 0.5, yaw: 0.0}
goal: {x: 10.5, y: 6.5, yaw: 1.57}
timeout_sec: 180
interventions: []
