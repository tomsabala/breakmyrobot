#
# The baseline mission plus one intervention, so the runner's dispatch path is
# exercised by a real scenario rather than only by a unit test.
#
# THIS FAULT NOW HAPPENS. /faults/spawn_obstacle is served by
# ral_faults/fault_manager.py, which calls /world/ral_apartment/create: gz
# creates the box, the lidar sees it on the next sweep, the obstacle layer
# marks it and the planner has to deal with it. The fields below are
# unchanged from the Phase 3 version of this file, deliberately - the same
# scenario that recorded `not_applied` against a missing service now records
# `applied`, so the two runs are directly comparable.
#
# Expected outcomes, all valid: a replan around the box, a wait, or an abort.
# What is measured: plan_publications against baseline_roomba's, a finite
# fault_to_response_s, and obstacle_min_clearance_m above zero - the robot
# must never intersect the box it was asked to avoid. plot.png draws the
# obstacle SOLID when the intervention was applied and dashed when it was not.
#
# Poses are in the gz WORLD frame. An obstacle pose stays in `world`: gz
# entity poses are defined there, and converting one through world_to_map
# would place the box somewhere else entirely.

experiment_id: obstacle_roomba
robot: roomba
world: ral_apartment
seed: 1
initial_pose: {x: 0.5, y: 0.5, yaw: 0.0}
goal: {x: 10.5, y: 6.5, yaw: 1.57}
timeout_sec: 180
interventions:
  # 20 s sim after goal acceptance, by which point the robot is in room 1/2
  # and the box lands ahead of it rather than on top of it.
  - at_sec: 20.0
    type: spawn_obstacle
    params:
      name: blocker_1
      pose: {x: 6.0, y: 3.0, yaw: 0.0}
      size: {x: 1.2, y: 0.2, z: 0.6}
