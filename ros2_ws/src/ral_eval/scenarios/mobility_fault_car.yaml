#
# The car's baseline mission with a plant that stops doing what it is told: a
# persistent external wrench pushing BACK along the vehicle's own x axis, so
# the commanded cruise speed and the achieved speed diverge and the autopilot's
# throttle controller has to cope.
#
# Why a force and not a MAVLink filter: intercepting the setpoint would change
# what the vehicle was ASKED to do, which is a different fault. The wrench
# changes what the body DOES while the command is untouched.
#
# The evidence on this platform is `speed_vs_target`, not `cmd_vs_achieved`:
# ArduRover is commanded by position setpoint and its throttle output is PWM,
# not a velocity, so there is no commanded velocity to compare against. The
# comparison is the achieved speed (differentiated simulator truth, used as an
# evaluation signal and not as something the robot knew) against WP_SPEED
# 1.0 m/s from rover_ackermann.parm.
#
# CALIBRATION RULE, the same one mobility_fault_roomba.yaml follows: the force
# committed here must be one MEASURED to produce a deficit of at least 20% on
# THIS plant. A force that produces no deficit is not a mobility fault, and
# committing one would claim an effect that never happened. The ladder is
# -40 N, then -80, then -160; if -160 N still produces no deficit, the fault
# becomes a yaw torque of 6.0 N.m (the traction limit is about
# mu * N * half-track = 78 * 0.13 = 10 N.m) and the evidence becomes heading
# deviation instead of speed deficit.
#
# MEASURED RESULT, this mission, re-measured after the rear-wheel actuator was
# resized (ral_car/model.sdf channel-2 multiplier 35 -> 70, which is what makes
# the configured 1.0 m/s reachable at all). Every number below is the
# after-activation mean achieved speed from `metrics.json`'s
# `speed_vs_target.after_activation`, so all three are measured over the same
# part of the same mission:
#
#     0 N     mean achieved 0.922 m/s   the unfaulted reference, this scenario
#             (runs/mobility_fault_car_20261025T131455Z)   run with the wrench
#                                       enabled and zero
#     -40 N   mean achieved 0.773 m/s   16% deficit, below the 20% this fault
#             (runs/mobility_fault_car_20261025T131320Z)   is calibrated to;
#                                       the mission still reached the goal
#     -80 N   mean achieved -0.085 m/s  the body is pushed BACKWARDS, makes no
#             (runs/mobility_fault_car_20261025T131619Z)   progress at all
#                                       (its own estimate moved 0.164 m in
#                                       15 s sim), and the mission ends
#                                       `mavros:stalled_no_progress` - the
#                                       runner's deterministic safe stop, not
#                                       a decision the autopilot made
#
# -80 N is the first value on the ladder to reach the 20% this scenario is
# calibrated to, so it is the one committed. The expected outcome of this
# scenario is therefore an ABORT, not a completed mission: a fault with a real
# effect and a safe stop is the result, and a run that still reached the goal
# would mean the wrench did nothing.
#
# THE MISSION IS SHORT, AND THE FAULT TIME FOLLOWS FROM THAT. This platform
# drives straight at its target, so its missions are limited to what a
# straight line in a 12 x 8 m apartment allows, and it stops as soon as the
# FCU's own wp_dist is inside WP_RADIUS 1.0 m AND its own estimate is within
# arrival_estimate_tolerance_m 1.5 m of the setpoint - about 1.4 m short of
# the goal in the runs above. MEASURED: the unfaulted mission above is 6.8 s
# sim end to end. An intervention at 20 s sim therefore never fired at all
# (`not_dispatched:mission_ended_first` in run.json), which reads as a
# baseline run wearing a fault scenario's name. 2.0 s sim puts the wrench on
# a vehicle that is up to speed with several seconds of mission left to
# measure it in; the goal is extended to the far side of room 2 for the same
# reason.

experiment_id: mobility_fault_car
robot: car
world: ral_apartment
seed: 1
initial_pose: {x: 1.0, y: 4.0, yaw: 0.0}
goal: {x: 7.5, y: 4.0, yaw: 0.0}
timeout_sec: 180
interventions:
  - at_sec: 2.0
    type: mobility_fault
    params: {enabled: true, force_x_n: -80.0, force_y_n: 0.0, torque_z_nm: 0.0}
